name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: Format
        run: terraform fmt -check -recursive
      - name: Validate root module
        run: |
          terraform init -backend=false
          terraform validate
      - name: Validate complete example
        working-directory: examples/complete
        run: |
          terraform init -backend=false
          terraform validate
      - name: Validate minimal example
        working-directory: examples/minimal
        run: |
          terraform init -backend=false
          terraform validate
      - name: Terraform test
        run: |
          terraform init -backend=false
          terraform test
